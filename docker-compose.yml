# Production stack for ChevaletAnonBot (Go): the bot + its PostgreSQL.
#
# Quick start:
#   cp .env.example .env   # then fill in BOT_TOKEN, ADMINS, PROXY, ...
#   make up                # or: docker compose up -d --build
#
# Config plumbing: the bot service reads the WHOLE `.env` through `env_file`, so
# every key internal/config knows about reaches the process. The explicit
# `environment:` block below keeps ONLY the deliberate per-stack overrides
# (DB_HOST points at the compose service, not at whatever the host `.env` says).
# This replaces the old hand-maintained whitelist that silently dropped config
# keys (BACKUP_CHAT_ID, DYNSET_PATH, AI_ENABLED, BATCH_*, TOKEN_KEYS, ...) — see
# docs/hardening/RELEASE-v3.4.1.md (H-9).
#
# The Go bot runs `CREATE TABLE IF NOT EXISTS` on startup, so no schema file is
# needed — existing data is preserved untouched.

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: telegram-bot-db
    restart: unless-stopped
    # Docker's default 10 s is shorter than a checkpoint under load; 30 s lets
    # the engine shut down cleanly instead of being SIGKILLed.
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - bot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Telegram Bot (Go)
  bot:
    build: .
    container_name: telegram-bot
    restart: unless-stopped
    init: true
    # Long enough for the updater to finish the in-flight update and drain the
    # batcher/outbox on SIGTERM. Docker's 10 s default used to SIGKILL us
    # mid-drain on every `docker compose up -d`.
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Deliberate override: the bot talks to the compose service by name.
      # Everything else (including new keys) comes from .env via env_file.
      - DB_HOST=postgres
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # dynamic_settings.json is read/written at runtime (admin ai-url / ai-session).
      - ./dynamic_settings.json:/app/dynamic_settings.json
      - ./Texts:/app/Texts:ro
      - ./backups:/app/backups
    networks:
      - bot-network
    healthcheck:
      # HTTP liveness/readiness endpoint, not a bare TCP connect: the old
      # `nc -z` probe stayed green while polling/DB was dead, so Docker never
      # restarted a hung bot. Busybox `wget` ships in this image (alpine:3.20).
      # A missing endpoint (pre-v3.4.1 image) fails the probe loudly instead of
      # silently accepting a dead bot.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${HEALTH_PORT:-12564}/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  bot-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
