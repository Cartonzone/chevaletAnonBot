# HISTORICAL: the 2026-11 Go-port cutover stack for the OLD shared-database host.
#
# The Go bot connects to the EXISTING production Postgres container
# (telegram-bot-db) — the SAME database the Python bot uses. The schema is
# identical, so there is NO data migration: existing users/links/settings just
# work. This file does NOT define a postgres service and does NOT touch the
# Python stack; cutover is "stop the python container, up this one", and
# rollback is the reverse. See CUTOVER.md.
#
# > CURRENT PRODUCTION (since 2026-11-24) is the Germany host with its own
# > sanitized stack: deploy/prod/docker-compose.live.yml (repo source of truth),
# > container `telegram-bot` / `telegram-bot-db`, project `chevalet`, root
# > /opt/bots/chevalet. This file is kept for the historical cutover record and
# > is NOT the production stack of record.
#
# Before use, fill in:
#   - deploy/go/.env.prod   : a copy of the PRODUCTION .env (real BOT_TOKEN, DB
#                             creds for telegram-bot-db, ADMINS, chats, etc.)
#   - networks.prod.name    : the docker network telegram-bot-db is attached to
#                             (find it — see CUTOVER.md pre-flight step 2)
#
# Run with:
#   docker compose --env-file deploy/go/.env.prod -p go \
#     -f deploy/go/docker-compose.prod.yml up -d --build

services:
  go-bot:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: chevalet-go-bot:prod
    container_name: chevalet-go-bot-prod
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    env_file:
      - .env.prod
    environment:
      # DB_HOST is pinned to the existing production Postgres container name;
      # every other key comes from .env.prod verbatim (no silent drops).
      - DB_HOST=telegram-bot-db
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # Reuse the production AI dynamic settings for continuity (admin ai-url /
      # ai-session). Copy the python bot's file here first (see CUTOVER.md), or
      # remove this line to start from the .env AI_URL/AI_SESSION_ID defaults.
      - ./prod-dynamic_settings.json:/app/dynamic_settings.json
      # Startup fails closed when /app/backups is missing; the operations backup
      # dir on this OLD host was /opt/chevalet-go-staging/backups (historical path).
      - /opt/chevalet-go-staging/backups:/app/backups
    networks:
      - prod
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null \"http://127.0.0.1:$${HEALTH_PORT:-12564}/healthz\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  prod:
    external: true
    # The network telegram-bot-db is on — VERIFIED on the server (the python
    # stack's compose project is "chevaletbot_bot", so the network is
    # "chevaletbot_bot-network"; re-verify before cutover with:
    #   docker inspect telegram-bot-db --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}')
    name: chevaletbot_bot-network
