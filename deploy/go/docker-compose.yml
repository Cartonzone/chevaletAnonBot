# Staging stack for the Go port. Runs the Go bot against its OWN throwaway
# Postgres — it never touches the production database.
#
# Usage (from this directory, with a .env alongside it):
#   docker compose up --build
#
# The .env should be a copy of ../../.env.example with:
#   - BOT_TOKEN   = your STAGING bot token (from BotFather)
#   - PROXY       = your proxy URL (Telegram is otherwise unreachable)
#   - DB_NAME / DB_USER / DB_PASS = anything (a fresh test db is created here)
# DB_HOST is overridden to the postgres service below.
#
# env_file passes EVERY key (same H-9 fix as the production compose), so this
# stack exercises the real config surface instead of a hand-maintained subset.

services:
  go-postgres:
    image: postgres:16-alpine
    container_name: chevalet-go-db
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - go_postgres_data:/var/lib/postgresql/data
    networks:
      - go-bot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  go-bot:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: chevalet-go-bot
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    depends_on:
      go-postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DB_HOST=go-postgres
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # The bot validates that its backups dir exists at startup (v3.4.1 fails
      # closed otherwise). In production backup-v2.sh publishes real dumps here;
      # for staging an empty dir is enough (compose creates it).
      - ./backups:/app/backups
    networks:
      - go-bot-network
    healthcheck:
      # HTTP health endpoint (v3.4.1+); $${...} is resolved INSIDE the container
      # from its own env, so the probe follows the same HEALTH_PORT the bot uses.
      test: ["CMD-SHELL", "wget -q -O /dev/null \"http://127.0.0.1:$${HEALTH_PORT:-12564}/healthz\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  go-bot-network:
    driver: bridge

volumes:
  go_postgres_data:
    driver: local
